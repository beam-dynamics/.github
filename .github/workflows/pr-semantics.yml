name: Pull Request Semantics Check

on:
  workflow_call:
    inputs:
      pr_title:
        description: "Pull Request title to validate"
        required: true
        type: string

jobs:
  title-check:
    name: Validate PR Title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check PR title format
        run: |
          title="${{ inputs.pr_title }}"
          if [[ ! "$title" =~ ^\[BEAM-[0-9]+\] ]]; then
            echo "❌ PR title must start with a ticket reference like [BEAM-1234]"
            echo "   Got: '$title'"
            exit 1
          fi
          echo "✅ PR title is valid: '$title'"

